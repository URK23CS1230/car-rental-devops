# ─────────────────────────────────────────────────────────────────────────────
# ConfigMap — shared environment configuration for all services
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: car-rental-config
  namespace: car-rental
data:
  MONGO_HOST: "mongodb"
  MONGO_PORT: "27017"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "cardb"

---
# ─────────────────────────────────────────────────────────────────────────────
# Secret — sensitive credentials (base64 encoded)
# Replace values with: echo -n 'yourvalue' | base64
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: car-rental-secrets
  namespace: car-rental
type: Opaque
stringData:
  JWT_SECRET: "supersecretjwtkey123"
  POSTGRES_USER: "admin"
  POSTGRES_PASSWORD: "adminpassword"
