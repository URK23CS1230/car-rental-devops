# =============================================================================
# INGRESS — Single entry point for the entire platform
# Requires: nginx ingress controller installed in the cluster
#   kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.10.0/deploy/static/provider/cloud/deploy.yaml
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: car-rental-ingress
  namespace: car-rental
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    - host: car-rental.local        # Change to your real domain in production
      http:
        paths:
          # ── Auth Service ─────────────────────────────────────────────
          - path: /api/auth(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: auth-service
                port:
                  number: 3001

          # ── Car Service ──────────────────────────────────────────────
          - path: /api/cars(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: car-service
                port:
                  number: 8000

          # ── Booking Service ──────────────────────────────────────────
          - path: /api/bookings(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: booking-service
                port:
                  number: 8080

          # ── Frontend (catch-all) ─────────────────────────────────────
          - path: /(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: frontend
                port:
                  number: 80
