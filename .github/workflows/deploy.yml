name: CI/CD — Build & Push to DockerHub

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    name: Build, Tag & Push Docker Images
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout Code
        uses: actions/checkout@v4

      # ── 2. Set up Docker Buildx (for multi-platform / cache support) ─────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 3. Login to DockerHub ────────────────────────────────────────────
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ── 4a. Build & Push — Frontend ──────────────────────────────────────
      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/car-rental-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/car-rental-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to:   type=gha,scope=frontend,mode=max

      # ── 4b. Build & Push — Auth Service ─────────────────────────────────
      - name: Build & Push Auth Service
        uses: docker/build-push-action@v5
        with:
          context: ./auth-service
          file: ./auth-service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/car-rental-auth:latest
            ${{ secrets.DOCKER_USERNAME }}/car-rental-auth:${{ github.sha }}
          cache-from: type=gha,scope=auth-service
          cache-to:   type=gha,scope=auth-service,mode=max

      # ── 4c. Build & Push — Car Service ──────────────────────────────────
      - name: Build & Push Car Service
        uses: docker/build-push-action@v5
        with:
          context: ./car-service
          file: ./car-service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/car-rental-car:latest
            ${{ secrets.DOCKER_USERNAME }}/car-rental-car:${{ github.sha }}
          cache-from: type=gha,scope=car-service
          cache-to:   type=gha,scope=car-service,mode=max

      # ── 4d. Build & Push — Booking Service ──────────────────────────────
      - name: Build & Push Booking Service
        uses: docker/build-push-action@v5
        with:
          context: ./booking-service
          file: ./booking-service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/car-rental-booking:latest
            ${{ secrets.DOCKER_USERNAME }}/car-rental-booking:${{ github.sha }}
          cache-from: type=gha,scope=booking-service
          cache-to:   type=gha,scope=booking-service,mode=max

      # ── 5. Summary ───────────────────────────────────────────────────────
      - name: Print Image Summary
        run: |
          echo "✅ All images pushed to DockerHub successfully!"
          echo ""
          echo "  frontend : ${{ secrets.DOCKER_USERNAME }}/car-rental-frontend:${{ github.sha }}"
          echo "  auth     : ${{ secrets.DOCKER_USERNAME }}/car-rental-auth:${{ github.sha }}"
          echo "  car      : ${{ secrets.DOCKER_USERNAME }}/car-rental-car:${{ github.sha }}"
          echo "  booking  : ${{ secrets.DOCKER_USERNAME }}/car-rental-booking:${{ github.sha }}"
