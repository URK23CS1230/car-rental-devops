apiVersion: apps/v1
kind: Deployment
metadata:
  name: car-service
  labels:
    app: car-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: car-service
  template:
    metadata:
      labels:
        app: car-service
    spec:
      containers:
      - name: car-service
        image: yourdockerhub/car-service:latest
        ports:
        - containerPort: 8000
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: car-service
spec:
  selector:
    app: car-service
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
