# =============================================================================
# BOOKING SERVICE — Deployment + Service + HPA
# =============================================================================

# ─── Deployment ──────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-service
  namespace: car-rental
  labels:
    app: booking-service
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: booking-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: booking-service
    spec:
      containers:
        - name: booking-service
          image: YOUR_DOCKER_USERNAME/booking-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http

          env:
            - name: DATABASE_URL
              value: "jdbc:postgresql://postgres:5432/cardb"
            - name: DATABASE_DRIVER
              value: "org.postgresql.Driver"
            - name: DATABASE_PLATFORM
              value: "org.hibernate.dialect.PostgreSQLDialect"
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: car-rental-secrets
                  key: POSTGRES_USER
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: car-rental-secrets
                  key: POSTGRES_PASSWORD

          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"

          # Liveness — Spring Boot takes a moment to start; generous delay
          livenessProbe:
            httpGet:
              path: /bookings/health
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          # Readiness — Spring Boot app ready check
          readinessProbe:
            httpGet:
              path: /bookings/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5

      restartPolicy: Always

---
# ─── Service ─────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: booking-service
  namespace: car-rental
  labels:
    app: booking-service
spec:
  selector:
    app: booking-service
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP

---
# ─── Horizontal Pod Autoscaler ───────────────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: booking-service-hpa
  namespace: car-rental
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: booking-service
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
