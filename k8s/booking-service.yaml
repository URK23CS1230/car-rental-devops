# =============================================================================
# BOOKING SERVICE — Deployment + Service + HPA
# =============================================================================

# ─── Deployment ──────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-service
  namespace: car-rental
  labels:
    app: booking-service
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: booking-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: booking-service
    spec:
      # Wait for PostgreSQL to be reachable before starting
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL at postgres:5432..."
              until nc -z postgres 5432; do
                echo "PostgreSQL not ready, retrying in 3s..."
                sleep 3
              done
              echo "PostgreSQL is ready!"
      containers:
        - name: booking-service
          image: car-rental-booking:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http

          env:
            - name: DATABASE_URL
              value: "jdbc:postgresql://postgres:5432/cardb"
            - name: DATABASE_DRIVER
              value: "org.postgresql.Driver"
            - name: DATABASE_PLATFORM
              value: "org.hibernate.dialect.PostgreSQLDialect"
            - name: DATABASE_USER
              value: "admin"
            - name: DATABASE_PASSWORD
              value: "adminpassword"

          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"

          # Liveness — Spring Boot takes a moment to start; generous delay
          livenessProbe:
            httpGet:
              path: /bookings/health
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 5

          # Readiness — Spring Boot app ready check
          readinessProbe:
            httpGet:
              path: /bookings/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5

      restartPolicy: Always


---
# ─── Service ─────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: booking-service
  namespace: car-rental
  labels:
    app: booking-service
spec:
  selector:
    app: booking-service
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP

---
# ─── Horizontal Pod Autoscaler ───────────────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: booking-service-hpa
  namespace: car-rental
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: booking-service
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
